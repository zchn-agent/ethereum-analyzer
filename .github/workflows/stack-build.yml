name: Stack Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Haskell Stack
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Build
        run: stack build --profile && solc --combined-json ast examples/etherscan.io/CryptoKittiesCore.sol | stack exec -- ea-analyze && find work/ -name "*.dot" -exec dot -Tpng -O \{\} \;
